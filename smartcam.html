            });
        }
        
        if (notificationToggleMobile) {
            notificationToggleMobile.addEventListener('click', function() {
                this.classList.toggle('active');
                config.notificationEnabled = this.classList.contains('active');
                if (config.notificationEnabled && 'Notification' in window) {
                    Notification.requestPermission();
                }
                // 同步桌面端开关
                if (notificationToggle) {
                    notificationToggle.classList.toggle('active', config.notificationEnabled);
                }
            });
        }
        
        // 同步摄像头选择（移动端和桌面端）
        const cameraSelectMobile = document.getElementById('cameraSelectMobile');
        if (cameraSelectMobile) {
            cameraSelectMobile.addEventListener('change', () => {
                const deviceId = cameraSelectMobile.value;
                if (deviceId) {
                    stopCamera();
                    startCamera(deviceId);
                }
                // 同步桌面端选择
                const desktopSelect = document.getElementById('cameraSelect');
                if (desktopSelect) {
                    desktopSelect.value = deviceId;
                }
            });
        }

        // Initialize
        loadModel();
        loadCameras();
        if ('Notification' in window) Notification.requestPermission();

        // Image Modal Events
        const imageModal = document.getElementById('imageModal');
        const modalCloseBtn = document.querySelector('.image-modal-close');
        
        modalCloseBtn.addEventListener('click', () => {
            imageModal.classList.remove('active');
        });
        
        imageModal.addEventListener('click', (e) => {
            if (e.target === imageModal) {
                imageModal.classList.remove('active');
            }
        });
        
        // ESC key to close modal
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && imageModal.classList.contains('active')) {
                imageModal.classList.remove('active');
            }
        });

        // ==================== 移动端触摸优化 ====================
        
        // 检测设备类型
        const isTouchDevice = window.matchMedia('(pointer: coarse)').matches;
        const isMobile = window.innerWidth <= 767;
        const isIPad = window.innerWidth >= 768 && window.innerWidth <= 1024;
        
        // 触摸手势支持
        let touchStartY = 0;
        let touchEndY = 0;
        let touchStartX = 0;
        let touchEndX = 0;
        
        // 记录列表触摸滑动
        const recordsList = document.querySelector('.records-list');
        if (recordsList) {
            recordsList.addEventListener('touchstart', (e) => {
                touchStartY = e.changedTouches[0].screenY;
                touchStartX = e.changedTouches[0].screenX;
            }, { passive: true });
            
            recordsList.addEventListener('touchend', (e) => {
                touchEndY = e.changedTouches[0].screenY;
                touchEndX = e.changedTouches[0].screenX;
                handleSwipe();
            }, { passive: true });
        }
        
        // 处理滑动手势
        function handleSwipe() {
            const swipeThreshold = 50;
            const diffY = touchStartY - touchEndY;
            const diffX = touchStartX - touchEndX;
            
            // 检测左右滑动（用于切换模式）
            if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > swipeThreshold) {
                if (diffX > 0) {
                    // 向左滑动
                    console.log('Swiped left');
                } else {
                    // 向右滑动
                    console.log('Swiped right');
                }
            }
        }
        
        // 双击全屏功能（移动端视频区域）
        const videoPanel = document.querySelector('.video-panel');
        if (videoPanel && isTouchDevice) {
            let lastTap = 0;
            videoPanel.addEventListener('touchend', (e) => {
                const currentTime = new Date().getTime();
                const tapLength = currentTime - lastTap;
                if (tapLength < 300 && tapLength > 0) {
                    // 双击检测
                    toggleFullscreen();
                    e.preventDefault();
                }
                lastTap = currentTime;
            });
        }
        
        // 全屏切换功能
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen();
                } else if (document.documentElement.webkitRequestFullscreen) {
                    document.documentElement.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            }
        }
        
        // 防止移动端双击缩放
        let lastTouchEnd = 0;
        document.addEventListener('touchend', (e) => {
            const now = Date.now();
            if (now - lastTouchEnd <= 300) {
                e.preventDefault();
            }
            lastTouchEnd = now;
        }, { passive: false });
        
        // 移动端视口高度修复（处理地址栏显示/隐藏）
        function setViewportHeight() {
            const vh = window.innerHeight * 0.01;
            document.documentElement.style.setProperty('--vh', `${vh}px`);
        }
        
        setViewportHeight();
        window.addEventListener('resize', setViewportHeight);
        window.addEventListener('orientationchange', () => {
            setTimeout(setViewportHeight, 100);
        });
        
        // 移动端横竖屏提示
        function checkOrientation() {
            if (isMobile && window.innerWidth > window.innerHeight) {
                // 手机横屏时显示提示
                showOrientationTip();
            } else {
                hideOrientationTip();
            }
        }
        
        function showOrientationTip() {
            let tip = document.getElementById('orientationTip');
            if (!tip) {
                tip = document.createElement('div');
                tip.id = 'orientationTip';
                tip.style.cssText = `
                    position: fixed;
                    top: 0;
                    left: 0;
                    right: 0;
                    bottom: 0;
                    background: rgba(0,0,0,0.9);
                    display: flex;
                    flex-direction: column;
                    align-items: center;
                    justify-content: center;
                    z-index: 9999;
                    color: white;
                    font-size: 1.1rem;
                    text-align: center;
                    padding: 20px;
                `;
                tip.innerHTML = `
                    <svg width="60" height="60" viewBox="0 0 24 24" fill="currentColor" style="margin-bottom: 20px; animation: rotate 2s infinite;">
                        <path d="M16.48 2.52c3.27 1.55 5.61 4.72 5.97 8.48h1.5C23.44 4.84 18.29 0 12 0l-.66.03 3.81 3.81 1.33-1.32zm-6.25-.77c-.59-.59-1.54-.59-2.12 0L1.75 8.11c-.59.59-.59 1.54 0 2.12l12.02 12.02c.59.59 1.54.59 2.12 0l6.36-6.36c.59-.59.59-1.54 0-2.12L10.23 1.75zm4.6 19.44L2.81 9.17l6.36-6.36 12.02 12.02-6.36 6.36zm-7.31.29C4.25 19.94 1.91 16.76 1.55 13H.05C.56 19.16 5.71 24 12 24l.66-.03-3.81-3.81-1.33 1.32z"/>
                    </svg>
                    <p>建议竖屏使用</p>
                    <p style="font-size: 0.9rem; opacity: 0.8; margin-top: 10px;">请将手机旋转至竖屏模式以获得最佳体验</p>
                `;
                document.body.appendChild(tip);
                
                // 添加旋转动画
                const style = document.createElement('style');
                style.textContent = `
                    @keyframes rotate {
                        0%, 100% { transform: rotate(0deg); }
                        50% { transform: rotate(90deg); }
                    }
                `;
                document.head.appendChild(style);
            }
            tip.style.display = 'flex';
        }
        
        function hideOrientationTip() {
            const tip = document.getElementById('orientationTip');
            if (tip) {
                tip.style.display = 'none';
            }
        }
        
        window.addEventListener('orientationchange', checkOrientation);
        window.addEventListener('resize', checkOrientation);
        checkOrientation();
        
        // iPad 特定优化
        if (isIPad) {
            // 启用 iPad 的 hover 效果
            document.body.classList.add('ipad-device');
            
            // 优化触摸响应
            document.querySelectorAll('button, .mode-btn, .class-btn, .control-btn').forEach(btn => {
                btn.addEventListener('touchstart', function() {
                    this.style.transform = 'scale(0.98)';
                }, { passive: true });
                btn.addEventListener('touchend', function() {
                    this.style.transform = '';
                }, { passive: true });
            });
        }
        
        // 移动端按钮点击优化
        if (isTouchDevice) {
            document.querySelectorAll('button, .mode-btn, .class-btn, .control-btn, .record-item').forEach(el => {
                el.style.cursor = 'pointer';
                el.addEventListener('touchstart', () => {
                    el.style.opacity = '0.8';
                }, { passive: true });
                el.addEventListener('touchend', () => {
                    el.style.opacity = '';
                }, { passive: true });
            });
        }
        
        // 控制台输出设备信息
        console.log('设备信息:', {
            isTouchDevice,
            isMobile,
            isIPad,
            screenWidth: window.innerWidth,
            screenHeight: window.innerHeight,
            userAgent: navigator.userAgent
        });
    </script>

    <!-- 截图预览模态框 -->
    <div class="snapshot-modal" id="snapshotModal" onclick="closeSnapshotModal(event)">
        <div class="snapshot-modal-content">
            <button class="snapshot-modal-close" onclick="closeSnapshotModal(event)">&times;</button>
            <img id="snapshotModalImg" src="" alt="行为截图">
            <div class="snapshot-modal-label" id="snapshotModalLabel"></div>
        </div>
    </div>

    <script>
        // 截图预览功能
        function showSnapshotModal(snapshotUrl, message) {
            const modal = document.getElementById('snapshotModal');
            const img = document.getElementById('snapshotModalImg');
            const label = document.getElementById('snapshotModalLabel');
            
            img.src = snapshotUrl;
            label.textContent = message;
            modal.classList.add('active');
        }

        function closeSnapshotModal(event) {
            if (event.target === event.currentTarget || event.target.classList.contains('snapshot-modal-close')) {
                document.getElementById('snapshotModal').classList.remove('active');
            }
        }
    </script>
</body>
</html>
