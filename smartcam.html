<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartCam - 智能目标检测系统</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0d1117;
            --bg-card: #161b22;
            --color-primary: #f0883e;
            --color-accent: #58a6ff;
            --color-human: #00d4aa;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --color-success: #3fb950;
            --color-warning: #f85149;
            --border-color: #30363d;
            --shadow: 0 4px 24px rgba(0,0,0,0.4);
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100vh;
            overflow: hidden;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.4;
        }

        .app-container {
            display: grid;
            grid-template-columns: 320px 1fr 280px;
            grid-template-rows: 50px 1fr;
            height: 100vh;
            gap: 12px;
            padding: 12px;
        }

        /* Header */
        .header {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            background: var(--bg-card);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
        }

        .header h1 {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--color-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header h1 svg {
            width: 24px;
            height: 24px;
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            padding: 6px 12px;
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s;
        }

        .icon-btn:hover {
            background: var(--color-primary);
            color: white;
            border-color: var(--color-primary);
        }

        /* Left Panel - Controls */
        .left-panel {
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
        }

        .panel-section {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            padding: 12px;
        }

        .panel-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .panel-title svg {
            width: 16px;
            height: 16px;
        }

        /* Model Status */
        .model-status-compact {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--color-warning);
            animation: pulse 2s infinite;
        }

        .status-dot.loaded {
            background: var(--color-success);
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .progress-bar {
            flex: 1;
            height: 4px;
            background: var(--bg-primary);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--color-primary), var(--color-accent));
            transition: width 0.3s;
        }

        /* Mode Selector */
        .mode-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        .mode-btn {
            padding: 8px 4px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.75rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            transition: all 0.2s;
        }

        .mode-btn .icon {
            font-size: 1.2rem;
        }

        .mode-btn:hover, .mode-btn.active {
            background: var(--color-primary);
            color: white;
            border-color: var(--color-primary);
        }

        /* Class Selector */
        .class-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        .class-btn {
            padding: 6px 8px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s;
        }

        .class-btn:hover, .class-btn.active {
            background: var(--color-accent);
            color: white;
            border-color: var(--color-accent);
        }

        /* Settings */
        .setting-item {
            margin-bottom: 10px;
        }

        .setting-item:last-child {
            margin-bottom: 0;
        }

        .setting-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 4px;
            display: block;
        }

        select, input[type="range"] {
            width: 100%;
            padding: 6px 8px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 0.8rem;
        }

        input[type="range"] {
            padding: 0;
            height: 4px;
            -webkit-appearance: none;
            background: var(--bg-primary);
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: var(--color-primary);
            border-radius: 50%;
            cursor: pointer;
        }

        .range-value {
            font-size: 0.75rem;
            color: var(--color-primary);
            text-align: right;
            margin-top: 2px;
        }

        /* Toggle */
        .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .toggle-row:last-child {
            margin-bottom: 0;
        }

        .toggle-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .toggle {
            width: 36px;
            height: 20px;
            background: var(--border-color);
            border-radius: 10px;
            position: relative;
            cursor: pointer;
            transition: background 0.2s;
        }

        .toggle::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            background: white;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: transform 0.2s;
        }

        .toggle.active {
            background: var(--color-success);
        }

        .toggle.active::after {
            transform: translateX(16px);
        }

        /* Model Toggle */
        .model-toggle-row {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        .model-btn {
            flex: 1;
            padding: 8px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            transition: all 0.2s;
        }

        .model-btn:hover {
            border-color: var(--color-accent);
        }

        .model-btn.active {
            border-color: var(--color-success);
            background: rgba(63, 185, 80, 0.1);
        }

        .model-name {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .model-status {
            font-size: 0.65rem;
            color: var(--text-secondary);
        }

        .model-btn.active .model-status {
            color: var(--color-success);
        }

        .model-info {
            background: var(--bg-primary);
            border-radius: var(--radius-sm);
            padding: 8px;
        }

        .model-desc {
            font-size: 0.7rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
            line-height: 1.4;
        }

        .badge {
            background: var(--color-success);
            color: white;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 0.6rem;
            font-weight: 600;
        }

        .badge.high {
            background: var(--color-primary);
        }

        /* Center - Video */
        .video-panel {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .video-container {
            flex: 1;
            position: relative;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #video, #canvas {
            position: absolute;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .permission-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(13, 17, 23, 0.9);
            gap: 16px;
        }

        .permission-overlay.hidden {
            display: none;
        }

        .permission-overlay svg {
            width: 48px;
            height: 48px;
            color: var(--color-primary);
        }

        .permission-overlay p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .btn-primary {
            padding: 10px 24px;
            background: var(--color-primary);
            border: none;
            border-radius: var(--radius-sm);
            color: white;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-primary:hover:not(:disabled) {
            background: #ff9d5c;
            transform: translateY(-1px);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Video Overlay */
        .video-overlay {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
        }

        .overlay-badge {
            background: rgba(0,0,0,0.7);
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .overlay-badge.detecting .dot {
            background: var(--color-success);
            animation: pulse 1s infinite;
        }

        .overlay-badge .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-secondary);
        }

        .stats-group {
            display: flex;
            gap: 8px;
        }

        .stat-badge {
            background: rgba(0,0,0,0.7);
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            font-size: 0.75rem;
            text-align: center;
        }

        .stat-badge .value {
            color: var(--color-primary);
            font-weight: 700;
            font-size: 1rem;
        }

        .alert-banner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--color-warning);
            color: white;
            padding: 12px 24px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 1rem;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .alert-banner.active {
            opacity: 1;
        }

        /* Video Controls */
        .video-controls {
            padding: 10px 16px;
            background: var(--bg-primary);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .control-btn {
            padding: 8px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .control-btn:hover {
            background: var(--color-accent);
            color: white;
            border-color: var(--color-accent);
        }

        .control-btn.danger:hover {
            background: var(--color-warning);
            border-color: var(--color-warning);
        }

        /* Right Panel - Records */
        .right-panel {
            display: flex;
            flex-direction: column;
            background: var(--bg-card);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

        .records-header {
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .records-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .records-title svg {
            width: 16px;
            height: 16px;
        }

        .clear-btn {
            padding: 4px 8px;
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            font-size: 0.7rem;
            cursor: pointer;
        }

        .clear-btn:hover {
            background: var(--color-warning);
        }

        /* Study Stats Panel */
        .study-stats-panel {
            border-top: 1px solid var(--border-color);
            padding: 12px;
            background: rgba(59, 130, 246, 0.05);
        }

        .study-stats-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .study-stats-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .study-stats-title svg {
            width: 16px;
            height: 16px;
            fill: #3b82f6;
        }

        .view-logs-btn {
            padding: 4px 10px;
            background: #3b82f6;
            border: none;
            border-radius: var(--radius-sm);
            color: white;
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .view-logs-btn:hover {
            background: #2563eb;
        }

        .study-stats-content {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            padding: 4px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .stat-row:last-child {
            border-bottom: none;
        }

        .stat-row span:first-child {
            color: var(--text-secondary);
        }

        .stat-row span:last-child {
            font-weight: 600;
        }

        /* Behavior Logs Modal */
        .behavior-logs-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .behavior-logs-modal.active {
            display: flex;
        }

        .behavior-logs-content {
            background: var(--bg-card);
            width: 100%;
            max-width: 500px;
            max-height: 80vh;
            border-radius: var(--radius-lg);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .behavior-logs-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .behavior-logs-header h3 {
            font-size: 1rem;
            font-weight: 600;
        }

        .behavior-logs-close {
            width: 32px;
            height: 32px;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .behavior-logs-actions {
            display: flex;
            gap: 10px;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .btn-export, .btn-clear {
            flex: 1;
            padding: 8px 16px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-export {
            background: #3b82f6;
            color: white;
        }

        .btn-export:hover {
            background: #2563eb;
        }

        .btn-clear {
            background: var(--border-color);
            color: var(--text-primary);
        }

        .btn-clear:hover {
            background: var(--color-warning);
        }

        .behavior-logs-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px;
        }

        .behavior-log-item {
            padding: 10px;
            margin-bottom: 8px;
            border-radius: var(--radius-sm);
            background: var(--bg-primary);
            border-left: 3px solid transparent;
        }

        .behavior-log-item.log-focused {
            border-left-color: #3fb950;
            background: rgba(59, 178, 80, 0.1);
        }

        .behavior-log-item.log-distracted {
            border-left-color: #f85149;
            background: rgba(248, 81, 73, 0.1);
        }

        .behavior-log-item.log-warning {
            border-left-color: #f0883e;
            background: rgba(240, 136, 62, 0.1);
        }

        .log-time {
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .log-message {
            font-size: 0.85rem;
            color: var(--text-primary);
        }

        .empty-logs {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* 行为截图样式 */
        .log-snapshot {
            margin: 8px 0;
            border-radius: var(--radius-sm);
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .log-snapshot img {
            width: 100%;
            height: auto;
            display: block;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .log-snapshot img:hover {
            transform: scale(1.02);
        }

        /* 截图预览模态框 */
        .snapshot-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .snapshot-modal.active {
            display: flex;
        }

        .snapshot-modal-content {
            max-width: 90%;
            max-height: 90%;
            position: relative;
        }

        .snapshot-modal-content img {
            max-width: 100%;
            max-height: 80vh;
            border-radius: var(--radius-md);
        }

        .snapshot-modal-label {
            text-align: center;
            color: white;
            padding: 12px;
            font-size: 1rem;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 0 0 var(--radius-md) var(--radius-md);
            margin-top: -4px;
        }

        .snapshot-modal-close {
            position: absolute;
            top: -40px;
            right: 0;
            color: white;
            font-size: 2rem;
            cursor: pointer;
            background: none;
            border: none;
            width: 40px;
            height: 40px;
        }

        .records-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .record-item {
            background: var(--bg-primary);
            border-radius: var(--radius-sm);
            padding: 8px;
            margin-bottom: 8px;
            border: 1px solid var(--border-color);
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .record-item:hover {
            border-color: var(--color-primary);
            transform: translateX(2px);
        }

        .record-thumbnail {
            width: 100%;
            height: 80px;
            object-fit: cover;
            border-radius: var(--radius-sm);
            margin-bottom: 6px;
            background: var(--bg-card);
        }

        .record-time {
            color: var(--text-secondary);
            font-size: 0.7rem;
            margin-bottom: 2px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .record-info {
            color: var(--color-primary);
            font-weight: 500;
        }

        .record-download {
            color: var(--color-accent);
            font-size: 0.65rem;
            cursor: pointer;
        }

        .record-download:hover {
            text-decoration: underline;
        }

        /* Image Modal */
        .image-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .image-modal.active {
            display: flex;
        }

        .image-modal img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            border-radius: var(--radius-md);
        }

        .image-modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.1);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .image-modal-close:hover {
            background: rgba(255,255,255,0.2);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }

        .empty-state svg {
            width: 32px;
            height: 32px;
            margin-bottom: 8px;
            opacity: 0.5;
        }

        .empty-state p {
            font-size: 0.8rem;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;

            .panel-title {

            .mode-btn {

            .mode-btn .icon {

            }

            .class-btn {
                padding: 5px 6px;
                font-size: 0.7rem;
            }

            .model-btn {
                padding: 6px;
            }

            .model-name {
                font-size: 0.75rem;
            }

            .video-controls {

            .control-btn {
                padding: 6px 12px;

            }

            .record-item {
                padding: 6px;

            .record-thumbnail {

        /* ==================== 手机端快速设置面板样式 ==================== */
        .mobile-quick-settings {
            display: none;
        }

        .desktop-settings,
        .desktop-alerts {
            display: block;
        }

        .quick-settings-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .quick-setting-item {
            flex: 1;
        }

        .quick-range {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .quick-range input[type="range"] {
            flex: 1;
        }

        .btn-more-settings {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            padding: 6px 10px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            font-size: 0.6rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-more-settings:hover {
            background: var(--border-color);
            color: var(--text-primary);
        }

        /* 设置弹窗 */
        .settings-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: flex-end;
            justify-content: center;

        .settings-modal.active {
            display: flex;

            background: var(--bg-card);

            overflow: hidden;
            animation: slideUp 0.3s ease;

            from {
                transform: translateY(100%);

            to {
                transform: translateY(0);

            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);

        .settings-modal-header h3 {
            font-size: 0.9rem;
            font-weight: 500;
        }

        .settings-modal-close {
            width: 32px;
            height: 32px;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .settings-modal-body {
            padding: 12px 16px;
            overflow-y: auto;
            max-height: calc(80vh - 60px);
        }

        .settings-section {
            margin-bottom: 16px;
        }

        .settings-section-title {
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;

        .about-info {
            text-align: center;
            padding: 12px;
            color: var(--text-secondary);
        }

            margin: 4px 0;
            font-size: 0.8rem;
        }

        .about-info .version {
            font-size: 0.7rem;
            opacity: 0.7;
        }

        /* 手机端适配 (< 768px) - 紧凑设计 */
        @media screen and (max-width: 767px) {
            html, body {
                height: 100%;
                overflow: auto;
            }

            .app-container {
                display: flex;
                flex-direction: column;
                height: auto;
                min-height: 100vh;
                gap: 4px;
                padding: 4px;
            }

            /* Header 紧凑 */
            .header {
                padding: 0 8px;
                min-height: 36px;
                position: sticky;
                top: 0;
                z-index: 100;
            }

            .header h1 {
                font-size: 0.85rem;
            }

            .header h1 svg {
                width: 16px;
                height: 16px;
            }

            .header-actions {
                gap: 4px;
            }

            .icon-btn {
                padding: 4px 6px;
                font-size: 0.65rem;
            }

            .icon-btn svg {
                width: 10px;
                height: 10px;
            }

            /* 左侧面板 - 紧凑 */
            .left-panel {
                gap: 4px;
                order: 2;
            }

            .panel-section {
                padding: 6px;
            }

            .panel-title {
                font-size: 0.7rem;
                margin-bottom: 4px;
            }

            /* 模式选择器 - 紧凑 */
            .mode-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 3px;
            }

            .mode-btn {
                padding: 6px 2px;
                font-size: 0.6rem;
                min-height: auto;
            }

            .mode-btn .icon {
                font-size: 1rem;
            }

            /* 类别选择器 - 紧凑 */
            .class-grid {
                grid-template-columns: repeat(5, 1fr);
                gap: 2px;
            }

            .class-btn {
                padding: 4px 2px;
                font-size: 0.55rem;
                justify-content: center;
                min-height: auto;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            /* 显示移动端快速设置，隐藏桌面端设置 */
            .mobile-quick-settings {
                display: block;
            }

            .desktop-settings,
            .desktop-alerts {
                display: none;
            }

            /* 快速设置样式 */
            .quick-settings-row {
                gap: 6px;
            }

            .quick-range {
                gap: 4px;
            }

            .quick-range input[type="range"] {
                height: 4px;
            }

            .quick-range .range-value {
                font-size: 0.65rem;
                min-width: 28px;
                text-align: right;
            }

            .btn-more-settings {
                padding: 4px 8px;
                font-size: 0.55rem;
            }

            /* 设置项 - 紧凑 */
            .setting-item {
                margin-bottom: 6px;
            }

            .setting-label {
                font-size: 0.65rem;
            }

            select, input[type="range"] {
                padding: 5px;
                font-size: 0.75rem;
            }

            /* 模型切换 - 紧凑 */
            .model-toggle-row {
                flex-direction: row;
                gap: 4px;
            }

            .model-btn {
                flex-direction: column;
                justify-content: center;
                align-items: center;
                padding: 6px 4px;
                flex: 1;
                min-height: auto;
            }

            .model-name {
                font-size: 0.65rem;
            }

            .model-status {
                font-size: 0.55rem;
            }

            .model-desc {
                display: none !important;
            }

            /* 视频区域 - 紧凑 */
            .video-panel {
                order: 1;
                min-height: 35vh;
                max-height: 45vh;
            }

            .video-container {
                min-height: 150px;
            }

            .video-overlay {
                top: 4px;
                left: 4px;
                right: 4px;
            }

            .overlay-badge {
                padding: 2px 6px;
                font-size: 0.6rem;
            }

            .stats-group {
                gap: 4px;
            }

            .stat-badge {
                padding: 2px 6px;
                font-size: 0.55rem;
            }

            .stat-badge .value {
                font-size: 0.75rem;
            }

            .alert-banner {
                padding: 6px 10px;
                font-size: 0.75rem;
            }

            /* 视频控制按钮 - 紧凑 */
            .video-controls {
                padding: 6px;
                gap: 4px;
                flex-wrap: wrap;
            }

            .control-btn {
                flex: 1;
                min-width: 60px;
                padding: 6px 8px;
                font-size: 0.65rem;
                justify-content: center;
                min-height: auto;
            }

            /* 右侧面板 - 检测记录紧凑 */
            .right-panel {
                order: 3;
                max-height: 180px;
            }

            .records-header {
                padding: 6px;
            }

            .records-title {
                font-size: 0.7rem;
            }

            .records-list {
                padding: 4px;
            }

            .record-item {
                padding: 6px;
                margin-bottom: 4px;
            }

            .record-thumbnail {
                height: 60px;
            }

            .record-time {
                font-size: 0.6rem;
            }

            .record-info {
                font-size: 0.7rem;
            }

            /* 图片模态框 */
            .image-modal {
                padding: 6px;
            }

            .image-modal-close {
                top: 6px;
                right: 6px;
                width: 28px;
                height: 28px;
                font-size: 1rem;
            }

            /* 权限提示 */
            .permission-overlay svg {
                width: 32px;
                height: 32px;
            }

            .permission-overlay p {
                font-size: 0.75rem;
                text-align: center;
                padding: 0 12px;
            }

            .btn-primary {
                padding: 8px 16px;
                font-size: 0.8rem;
            }

            /* 触摸优化 - 移除固定高度 */
            .mode-btn, .class-btn, .control-btn, .icon-btn, .model-btn {
                -webkit-tap-highlight-color: transparent;
            }

            /* 隐藏滚动条但保持功能 */
            ::-webkit-scrollbar {
                width: 2px;
                height: 2px;
            }
        }

        /* 小屏手机 (< 480px) - 超紧凑 */
        @media screen and (max-width: 480px) {
            .app-container {
                padding: 3px;
                gap: 3px;
            }

            .header {
                min-height: 32px;
                padding: 0 6px;
            }

            .header h1 {
                font-size: 0.75rem;
            }

            .header-actions .icon-btn span {
                display: none;
            }

            .header-actions .icon-btn {
                padding: 3px;
            }

            .mode-grid {
                grid-template-columns: repeat(4, 1fr);
            }

            .mode-btn {
                padding: 5px 1px;
                font-size: 0.55rem;
            }

            .mode-btn .icon {
                font-size: 0.9rem;
            }

            .class-grid {
                grid-template-columns: repeat(5, 1fr);
                gap: 2px;
            }

            .class-btn {
                padding: 3px 1px;
                font-size: 0.5rem;
            }

            .video-panel {
                min-height: 30vh;
                max-height: 40vh;
            }

            .control-btn {
                min-width: 50px;
                padding: 5px 6px;
                font-size: 0.6rem;
            }

            .right-panel {
                max-height: 150px;
            }
        }

        /* iPad 横屏/竖屏检测 */
        @media screen and (min-width: 768px) and (max-width: 1024px) and (orientation: portrait) {
            .app-container {
                grid-template-columns: 1fr;
                grid-template-rows: 45px auto 1fr auto;
            }

            .left-panel {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
            }

            .right-panel {
                max-height: 250px;
            }
        }

        /* 横屏手机优化 */
        @media screen and (max-height: 500px) and (orientation: landscape) {
            .app-container {
                flex-direction: row;
                flex-wrap: wrap;
            }

            .header {
                width: 100%;
                min-height: 36px;
            }

            .video-panel {
                flex: 1;
                min-height: auto;
                max-height: none;
                order: 1;
            }

            .left-panel {
                width: 200px;
                order: 2;
            }

            .right-panel {
                width: 100%;
                max-height: 150px;
                order: 3;
            }
        }

        /* 触摸设备优化 */
        @media (hover: none) and (pointer: coarse) {
            .mode-btn:active, .class-btn:active, .control-btn:active {
                transform: scale(0.98);
            }

            .record-item:active {
                transform: scale(0.99);
            }
        }

        /* 暗黑模式优化 */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-primary: #0d1117;
                --bg-card: #161b22;
            }
        }

        /* 减少动画（用户偏好） */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

    <script src="models/tf.min.js"></script>
    <script src="models/coco-ssd.min.js"></script>
    <script src="models/ort.min.js"></script>
    <script>
        const CLASS_NAMES = {
            // 人物动物
            'person': '人体', 'cat': '猫', 'dog': '狗', 'bird': '鸟',
            'horse': '马', 'cow': '牛', 'sheep': '羊', 'elephant': '象',
            // 交通工具
            'car': '汽车', 'truck': '卡车', 'bus': '公交车', 'motorcycle': '摩托车',
            'bicycle': '自行车', 'airplane': '飞机', 'boat': '船', 'train': '火车',
            // 其他物体
            'backpack': '背包', 'umbrella': '雨伞', 'suitcase': '行李箱',
            'sports ball': '球', 'kite': '风筝', 'skateboard': '滑板',
            'bottle': '瓶子', 'cup': '杯子', 'chair': '椅子', 'couch': '沙发',
            'bed': '床', 'dining table': '餐桌', 'tv': '电视', 'laptop': '笔记本',
            'cell phone': '手机', 'book': '书', 'clock': '时钟', 'vase': '花瓶',
            'teddy bear': '泰迪熊'
        };

        let model = null;
        let mediaStream = null;
        let isDetecting = false;
        let isMirrored = false;
        let detectionRecords = [];
        let selectedClasses = new Set(['person']);
        let currentMode = 'human';
        
        const config = {
            confidenceThreshold: 0.5,
            soundEnabled: true,
            notificationEnabled: true
        };

        // ==================== 专注学习检测配置 ====================
        const studyConfig = {
            enabled: false,
            facePositionHistory: [],
            maxHistoryLength: 5,
            distractionThreshold: 1,
            lastFocusState: 'unknown',
            focusStartTime: null,
            totalFocusTime: 0,
            distractionCount: 0,
            behaviorLogs: [],
            consecutiveDistractedFrames: 0,
            consecutiveFocusedFrames: 0,
            lastAlertTime: 0,
            lastSnapshotTime: 0,
            alertCooldown: 1500,
            snapshotCooldown: 3000,
            behaviorSnapshots: []
        };

        // 专注状态分析 - 改进版（超高灵敏度）
        function analyzeFocusState(detections, canvasWidth, canvasHeight, canvas) {
            const personDetection = detections.find(d => d.class === 'person' && d.score >= config.confidenceThreshold);
            
            if (!personDetection) {
                studyConfig.consecutiveDistractedFrames++;
                studyConfig.consecutiveFocusedFrames = 0;
                return {
                    state: 'no_person',
                    message: '未检测到学生',
                    color: '#8b949e',
                    isFocused: false,
                    debug: { reason: 'no_detection' }
                };
            }

            const [x, y, width, height] = personDetection.bbox;
            const centerX = x + width / 2;
            const centerY = y + height / 2;
            const imageCenterX = canvasWidth / 2;
            const imageCenterY = canvasHeight / 2;

            // 计算人体相对于画面中心的位置（使用更敏感的归一化）
            const offsetX = (centerX - imageCenterX) / (canvasWidth / 2);
            const offsetY = (centerY - imageCenterY) / (canvasHeight / 2);
            const distanceFromCenter = Math.sqrt(offsetX * offsetX + offsetY * offsetY);

            // 计算人体占画面比例（判断远近）
            const personAreaRatio = (width * height) / (canvasWidth * canvasHeight);
            
            // 保存位置历史
            const now = Date.now();
            studyConfig.facePositionHistory.push({
                x: centerX,
                y: centerY,
                offsetX: offsetX,
                offsetY: offsetY,
                width: width,
                height: height,
                timestamp: now
            });

            // 限制历史记录长度
            if (studyConfig.facePositionHistory.length > studyConfig.maxHistoryLength) {
                studyConfig.facePositionHistory.shift();
            }

            // 分析移动趋势
            const movement = analyzeMovement();
            
            // 分析姿态变化
            const posture = analyzePosture();
            
            // 判断专注状态 - 使用更敏感的阈值
            let state, message, color, isFocused;
            let debugInfo = {};

            // 检测逻辑（按优先级排序）
            if (personAreaRatio < 0.05) {
                // 人体太小，可能离摄像头太远或不在主要位置
                state = 'distracted';
                message = '⚠️ 学生离摄像头太远';
                color = '#f85149';
                isFocused = false;
                debugInfo = { reason: 'too_far', ratio: personAreaRatio.toFixed(3) };
                studyConfig.consecutiveDistractedFrames++;
                studyConfig.consecutiveFocusedFrames = 0;
            } else if (distanceFromCenter > 0.25) {
                // 偏离中心（降低阈值从0.4到0.25）
                state = 'distracted';
                message = '⚠️ 注意力分散 - 学生看向别处';
                color = '#f85149';
                isFocused = false;
                debugInfo = { reason: 'off_center', distance: distanceFromCenter.toFixed(3) };
                studyConfig.consecutiveDistractedFrames++;
                studyConfig.consecutiveFocusedFrames = 0;
            } else if (movement.isMovingFast) {
                // 快速移动（降低阈值）
                state = 'restless';
                message = '⚠️ 坐立不安 - 频繁移动';
                color = '#f85149';
                isFocused = false;
                debugInfo = { reason: 'moving_fast', speed: movement.speed.toFixed(3) };
                studyConfig.consecutiveDistractedFrames++;
                studyConfig.consecutiveFocusedFrames = 0;
            } else if (movement.isShaking) {
                // 身体晃动
                state = 'restless';
                message = '⚠️ 身体晃动 - 请保持静止';
                color = '#f85149';
                isFocused = false;
                debugInfo = { reason: 'shaking', shakeCount: movement.shakeCount };
                studyConfig.consecutiveDistractedFrames++;
                studyConfig.consecutiveFocusedFrames = 0;
            } else if (posture.isLeaning) {
                // 身体倾斜
                state = 'warning';
                message = '⚡ 姿势不正 - 请坐端正';
                color = '#f0883e';
                isFocused = false;
                debugInfo = { reason: 'leaning', leanAngle: posture.leanAngle.toFixed(1) };
                studyConfig.consecutiveDistractedFrames++;
                studyConfig.consecutiveFocusedFrames = 0;
            } else if (distanceFromCenter > 0.12) {
                // 轻微偏离（降低阈值从0.2到0.12）
                state = 'warning';
                message = '⚡ 轻微走神 - 请集中注意力';
                color = '#f0883e';
                isFocused = false;
                debugInfo = { reason: 'slight_off', distance: distanceFromCenter.toFixed(3) };
                studyConfig.consecutiveDistractedFrames++;
                studyConfig.consecutiveFocusedFrames = 0;
            } else {
                // 专注状态
                state = 'focused';
                message = '✅ 专注学习中';
                color = '#3fb950';
                isFocused = true;
                debugInfo = { reason: 'focused', distance: distanceFromCenter.toFixed(3) };
                studyConfig.consecutiveFocusedFrames++;
                studyConfig.consecutiveDistractedFrames = 0;
            }

            // 立即记录任何分心状态（提高灵敏度）
            if (studyConfig.consecutiveDistractedFrames >= 1 || studyConfig.consecutiveFocusedFrames >= 2) {
                logBehavior(state, message, canvas);
            }

            return {
                state,
                message,
                color,
                isFocused,
                offsetX,
                offsetY,
                distance: distanceFromCenter,
                movement: movement.speed,
                debug: debugInfo
            };
        }

        // 分析移动趋势 - 改进版
        function analyzeMovement() {
            const history = studyConfig.facePositionHistory;
            if (history.length < 3) {
                return { isMovingFast: false, isShaking: false, speed: 0, shakeCount: 0 };
            }

            let totalMovement = 0;
            let directionChanges = 0;
            let lastDirectionX = 0;
            let lastDirectionY = 0;

            for (let i = 1; i < history.length; i++) {
                const dx = history[i].x - history[i-1].x;
                const dy = history[i].y - history[i-1].y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                totalMovement += distance;

                // 检测方向变化（晃动）
                if (i > 1) {
                    const currentDirectionX = dx > 0 ? 1 : (dx < 0 ? -1 : 0);
                    const currentDirectionY = dy > 0 ? 1 : (dy < 0 ? -1 : 0);
                    
                    if ((currentDirectionX !== 0 && currentDirectionX !== lastDirectionX) ||
                        (currentDirectionY !== 0 && currentDirectionY !== lastDirectionY)) {
                        directionChanges++;
                    }
                    
                    lastDirectionX = currentDirectionX;
                    lastDirectionY = currentDirectionY;
                }
            }

            const avgSpeed = totalMovement / (history.length - 1);
            const timeSpan = history[history.length - 1].timestamp - history[0].timestamp;
            const normalizedSpeed = timeSpan > 0 ? (avgSpeed / timeSpan) * 1000 : 0;

            return {
                isMovingFast: normalizedSpeed > 0.08,
                isShaking: directionChanges >= 3,
                speed: normalizedSpeed,
                shakeCount: directionChanges
            };
        }

        // 分析姿态
        function analyzePosture() {
            const history = studyConfig.facePositionHistory;
            if (history.length < 2) {
                return { isLeaning: false, leanAngle: 0 };
            }

            const recent = history.slice(-3);
            let totalWidthChange = 0;
            let totalHeightChange = 0;

            for (let i = 1; i < recent.length; i++) {
                totalWidthChange += Math.abs(recent[i].width - recent[i-1].width);
                totalHeightChange += Math.abs(recent[i].height - recent[i-1].height);
            }

            // 如果宽度变化大但高度变化小，可能是侧身
            const isLeaning = totalWidthChange > totalHeightChange * 1.5;
            const leanAngle = Math.atan2(totalHeightChange, totalWidthChange) * (180 / Math.PI);

            return { isLeaning, leanAngle };
        }

        // 记录行为日志并截图
        function logBehavior(state, message, canvas = null) {
            const now = Date.now();
            
            // 状态变化时记录
            if (state !== studyConfig.lastFocusState) {
                // 如果检测到分心，截图
                let snapshot = null;
                if (canvas && (state === 'distracted' || state === 'restless' || state === 'warning')) {
                    snapshot = canvas.toDataURL('image/jpeg', 0.7);
                }
                
                const logEntry = {
                    timestamp: now,
                    state: state,
                    message: message,
                    duration: studyConfig.focusStartTime ? now - studyConfig.focusStartTime : 0,
                    snapshot: snapshot
                };
                
                studyConfig.behaviorLogs.push(logEntry);

                // 限制日志数量
                if (studyConfig.behaviorLogs.length > 100) {
                    studyConfig.behaviorLogs.shift();
                }

                // 更新统计
                if (state === 'distracted' || state === 'restless') {
                    studyConfig.distractionCount++;

                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.value = 800;
                oscillator.type = 'sine';
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
                
                oscillator.start(audioContext.currentTime);

        // YOLOv8预处理函数 - 超低内存版 (320x320)
        function preprocessYOLO(imageData, canvas, ctx, inputSize = 320) {
            const width = imageData.videoWidth || imageData.width || 640;
            const height = imageData.videoHeight || imageData.height || 480;
            
            // 计算缩放比例，保持宽高比
            const scale = Math.min(inputSize / width, inputSize / height);
            const newWidth = Math.floor(width * scale);
            const newHeight = Math.floor(height * scale);
            const x = Math.floor((inputSize - newWidth) / 2);
            const y = Math.floor((inputSize - newHeight) / 2);
            
            // 填充灰色背景并绘制图像
            ctx.fillStyle = '#808080';
            ctx.fillRect(0, 0, inputSize, inputSize);
            ctx.drawImage(imageData, x, y, newWidth, newHeight);
            
            // 转换为tensor
            const imageData2D = ctx.getImageData(0, 0, inputSize, inputSize);
            const data = imageData2D.data;
            
            // 使用预分配的缓冲区（避免每次都创建新数组）
            const bufferSize = inputSize * inputSize * 3;
            if (!yoloFloatBuffer || yoloFloatBuffer.length !== bufferSize) {
                yoloFloatBuffer = new Float32Array(bufferSize);
            }
            
            // RGB归一化 - CHW格式 (Channel, Height, Width)
            const channelSize = inputSize * inputSize;
            for (let i = 0; i < channelSize; i++) {
                yoloFloatBuffer[i] = data[i * 4] / 255;                        // R
                yoloFloatBuffer[channelSize + i] = data[i * 4 + 1] / 255;     // G
                yoloFloatBuffer[2 * channelSize + i] = data[i * 4 + 2] / 255; // B
            }
            
            // 创建tensor时复制数据（避免共享内存问题）
            return {
                tensor: new ort.Tensor('float32', yoloFloatBuffer.slice(), [1, 3, inputSize, inputSize]),
                scale: scale,
                padding: { x, y }
            };
        }

        // YOLOv8后处理函数 - 修复版
        function postprocessYOLO(output, confidenceThreshold, imgWidth, imgHeight, scale, padding) {
            const predictions = [];
            const data = output.data;
            const dims = output.dims;
            
            // YOLOv8输出格式: [1, 84, 8400]
            // 84 = 4 (bbox) + 80 (classes)
            // 8400 = numAnchors
            const numAnchors = dims[2];
            const numClasses = 80;
            
            for (let i = 0; i < numAnchors; i++) {
                // 获取边界框坐标 (前4行)
                const cx = data[i];
                const cy = data[numAnchors + i];
                const w = data[2 * numAnchors + i];
                const h = data[3 * numAnchors + i];
                
                // 找到最大类别分数 (后80行)
                let maxScore = 0;
                let maxClass = 0;
                
                for (let c = 0; c < numClasses; c++) {
                    const score = data[(4 + c) * numAnchors + i];
                    if (score > maxScore) {
                        maxScore = score;
                        maxClass = c;
                    }
                }
                
                // YOLOv8输出已经是类别分数，不需要乘以objectness
                if (maxScore > confidenceThreshold) {
                    // 转换回原始图像坐标
                    const x1 = (cx - w / 2 - padding.x) / scale;
                    const y1 = (cy - h / 2 - padding.y) / scale;
                    const x2 = (cx + w / 2 - padding.x) / scale;
                    const y2 = (cy + h / 2 - padding.y) / scale;
                    
                    // 确保坐标在图像范围内
                    const finalX = Math.max(0, Math.min(imgWidth, x1));
                    const finalY = Math.max(0, Math.min(imgHeight, y1));
                    const finalW = Math.max(0, Math.min(imgWidth - finalX, x2 - x1));
                    const finalH = Math.max(0, Math.min(imgHeight - finalY, y2 - y1));
                    
                    if (finalW > 0 && finalH > 0) {
                        predictions.push({
                            class: YOLO_CLASSES[maxClass],
                            score: maxScore,
                            bbox: [finalX, finalY, finalW, finalH]
                        });
                    }
                }
            }
            
            // NMS (非极大值抑制)
            return nms(predictions, 0.45);
        }

        // NMS实现
        function nms(predictions, iouThreshold) {
            predictions.sort((a, b) => b.score - a.score);
            const selected = [];
            
            while (predictions.length > 0) {
                const current = predictions.shift();
                selected.push(current);
                
                predictions = predictions.filter(p => {
                    const iou = calculateIoU(current.bbox, p.bbox);
                    return iou < iouThreshold;
                });
            }
            
            return selected;
        }

        function calculateIoU(box1, box2) {
            const [x1, y1, w1, h1] = box1;
            const [x2, y2, w2, h2] = box2;
            
            const xi1 = Math.max(x1, x2);
            const yi1 = Math.max(y1, y2);
            const xi2 = Math.min(x1 + w1, x2 + w2);
            const yi2 = Math.min(y1 + h1, y2 + h2);
            
            const interArea = Math.max(0, xi2 - xi1) * Math.max(0, yi2 - yi1);
            const box1Area = w1 * h1;
            const box2Area = w2 * h2;
            
            return interArea / (box1Area + box2Area - interArea);
        }

        async function startDetection() {
            if (isDetecting) return;
            isDetecting = true;

            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            let lastFpsUpdate = performance.now();
            let fpsFrameCount = 0;
            frameCounter = 0;
            
            // 等待视频准备好后再设置canvas尺寸
            if (video.videoWidth > 0) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
            }
            
            // 重用一个预处理canvas - YOLO使用320x320
            const preprocCanvas = document.createElement('canvas');
            preprocCanvas.width = 320;
            preprocCanvas.height = 320;
            const preprocCtx = preprocCanvas.getContext('2d', { willReadFrequently: true });

            async function detect() {
                if (!isDetecting) return;

                // 确保canvas尺寸正确
                if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
                    canvas.width = video.videoWidth || 640;
                    canvas.height = video.videoHeight || 480;
                }

                ctx.drawImage(video, 0, 0);

                // 每帧都增加FPS计数
                fpsFrameCount++;
                const now = performance.now();
                if (now - lastFpsUpdate >= 1000) {
                    document.getElementById('fpsValue').textContent = fpsFrameCount;
                    fpsFrameCount = 0;
                    lastFpsUpdate = now;
                }

                // 帧跳过优化：根据模型类型使用不同的跳过频率
                frameCounter++;
                const currentFrameSkip = useYOLO ? MEMORY_CONFIG.yoloFrameSkip : MEMORY_CONFIG.cocoFrameSkip;
                if (frameCounter % currentFrameSkip !== 0) {
                    requestAnimationFrame(detect);
                    return;
                }

                try {
                    let predictions = [];
                    
                    if (useYOLO && yoloSession) {
                        // 智能YOLO模式：先用COCO-SSD快速检测，有目标才用YOLO确认
                        yoloConfirmCounter++;
                        
                        // 每3次YOLO检测中，2次用COCO-SSD，1次用YOLO
                        if (yoloConfirmCounter % 3 !== 0) {
                            // 使用COCO-SSD快速检测
                            predictions = await model.detect(video);
                            
                            // 如果COCO-SSD检测到目标，下次用YOLO确认
                            const cocoDetections = predictions.filter(p => 
                                selectedClasses.has(p.class) && p.score >= config.confidenceThreshold * 0.8
                            );
                            
                            if (cocoDetections.length > 0) {
                                // 标记下次使用YOLO
                                yoloConfirmCounter = 2; // 确保下次用YOLO
                            }
                        } else {
                            // 使用YOLOv8进行高精度检测
                            const { tensor, scale, padding } = preprocessYOLO(video, preprocCanvas, preprocCtx);
                            const feeds = {};
                            feeds[yoloSession.inputNames[0]] = tensor;
                            const results = await yoloSession.run(feeds);
                            const output = results[yoloSession.outputNames[0]];
                            
                            predictions = postprocessYOLO(
                                output, 
                                config.confidenceThreshold,
                                video.videoWidth || 640,
                                video.videoHeight || 480,
                                scale,
                                padding
                            );
                        }
                    } else {
                        // 使用COCO-SSD进行检测
                        predictions = await model.detect(video);
                    }
                    
                    const filtered = predictions.filter(p => 
                        selectedClasses.has(p.class) && p.score >= config.confidenceThreshold
                    );

                    let detectionCount = 0;
                    filtered.forEach(p => {
                        detectionCount++;
                        const [x, y, w, h] = p.bbox;
                        ctx.strokeStyle = '#f0883e';
                        ctx.lineWidth = 3;
                        ctx.strokeRect(x, y, w, h);
                        
                        const label = `${CLASS_NAMES[p.class] || p.class} ${(p.score * 100).toFixed(0)}%`;
                        ctx.fillStyle = '#f0883e';
                        ctx.fillRect(x, y - 20, ctx.measureText(label).width + 16, 20);
                        ctx.fillStyle = '#fff';
                        ctx.font = '12px sans-serif';
                        ctx.fillText(label, x + 8, y - 6);
                    });

                    document.getElementById('detectionCount').textContent = detectionCount;

                    // 学习模式：专注状态分析
                    if (currentMode === 'study' && studyConfig.enabled) {
                        const focusResult = analyzeFocusState(filteredPredictions, canvas.width, canvas.height, canvas);
                        
                        // 显示专注状态
                        if (focusResult.state !== 'no_person') {
                            // 显示状态文字
                            ctx.fillStyle = focusResult.color;
                            ctx.font = 'bold 18px sans-serif';
                            ctx.fillText(focusResult.message, 10, 30);
                            
                            // 显示调试信息
                            ctx.font = '12px monospace';
                            ctx.fillStyle = '#fff';
                            const debugText = `距离: ${focusResult.distance.toFixed(2)} 移动: ${focusResult.movement.toFixed(3)}`;
                            ctx.fillText(debugText, 10, 50);
                            
                            // 绘制中心参考圆
                            ctx.beginPath();
                            ctx.arc(canvas.width / 2, canvas.height / 2, 20, 0, 2 * Math.PI);
                            ctx.strokeStyle = 'rgba(255,255,255,0.3)';
                            ctx.lineWidth = 2;
                            ctx.stroke();
                            
                            // 绘制位置指示器
                            const indicatorX = canvas.width / 2 + focusResult.offsetX * canvas.width / 2;
                            const indicatorY = canvas.height / 2 + focusResult.offsetY * canvas.height / 2;
                            ctx.beginPath();
                            ctx.arc(indicatorX, indicatorY, 10, 0, 2 * Math.PI);
                            ctx.fillStyle = focusResult.color;
                            ctx.fill();
                            ctx.strokeStyle = '#fff';
                            ctx.lineWidth = 3;
                            ctx.stroke();
                            
                            // 绘制连线
                            ctx.beginPath();
                            ctx.moveTo(canvas.width / 2, canvas.height / 2);
                            ctx.lineTo(indicatorX, indicatorY);
                            ctx.strokeStyle = focusResult.color;
                            ctx.lineWidth = 2;
                            ctx.setLineDash([5, 5]);
                            ctx.stroke();
                            ctx.setLineDash([]);
                        }
                        
                        // 更新状态显示
                        updateStatus(focusResult.message, !focusResult.isFocused);
                        
                        // 如果分心，显示警告（添加冷却时间防止频繁报警）
                        const now = Date.now();
                        if (!focusResult.isFocused && focusResult.state !== 'no_person') {
                            document.getElementById('alertBanner').classList.add('active');
                            document.getElementById('alertBanner').textContent = focusResult.message;
                            document.getElementById('alertBanner').style.background = focusResult.color;
                            
                            // 播放提醒音（带冷却）
                            if (config.soundEnabled && now - studyConfig.lastAlertTime > studyConfig.alertCooldown) {
                                playAlertSound();
                                studyConfig.lastAlertTime = now;
                            }
                        } else {
                            document.getElementById('alertBanner').classList.remove('active');
                        }
                    } else if (detectionCount > 0) {
                        updateStatus('检测中', true);
                        document.getElementById('alertBanner').classList.add('active');
                        handleDetection(detectionCount);
                    } else {
                        updateStatus('监控中', false);
                        document.getElementById('alertBanner').classList.remove('active');
                    }
                } catch (e) {
                    console.error('检测错误:', e);
                }

                requestAnimationFrame(detect);
            }

            detect();
            
            // 启动定期内存清理
            startMemoryCleanup();
        }

        let alertCooldown = false;
        function handleDetection(count) {
            if (alertCooldown) return;
            alertCooldown = true;

            addRecord(count);

        function playAlertSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.frequency.value = 800;
                oscillator.type = 'sine';
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                oscillator.start(audioCtx.currentTime);
                oscillator.stop(audioCtx.currentTime + 0.5);
            } catch (e) {
                console.error('声音播放失败:', e);
            }
        }

        // 静态缩略图画布，避免重复创建
        let snapshotCanvas = null;
        let snapshotCtx = null;
        
        function captureSnapshot() {
            const canvas = document.getElementById('canvas');
            
            // 确保canvas有有效尺寸
            if (canvas.width <= 0 || canvas.height <= 0) {
                console.warn('Canvas尺寸无效');
                return null;
            }
            
            // 初始化静态画布
            if (!snapshotCanvas) {
                snapshotCanvas = document.createElement('canvas');
                snapshotCtx = snapshotCanvas.getContext('2d', { willReadFrequently: true });
            }
            
            // 计算缩略图尺寸
            const scale = Math.min(1, MEMORY_CONFIG.maxScreenshotWidth / canvas.width);
            const targetWidth = Math.floor(canvas.width * scale);
            const targetHeight = Math.floor(canvas.height * scale);
            
            // 只在尺寸变化时重新设置
            if (snapshotCanvas.width !== targetWidth || snapshotCanvas.height !== targetHeight) {
                snapshotCanvas.width = targetWidth;
                snapshotCanvas.height = targetHeight;
            }
            
            // 清除之前的内容并绘制新图像
            snapshotCtx.clearRect(0, 0, targetWidth, targetHeight);
            snapshotCtx.drawImage(canvas, 0, 0, targetWidth, targetHeight);
            
            return snapshotCanvas.toDataURL('image/jpeg', MEMORY_CONFIG.screenshotQuality);
        }

        function addRecord(count) {
            const now = Date.now();
            
            // 检测间隔限制：避免短时间内重复记录
            if (now - lastDetectionTime < MEMORY_CONFIG.detectionInterval) {
                return;
            }
            lastDetectionTime = now;
            
            const imageData = captureSnapshot();
            if (!imageData) {
                console.warn('截图失败，跳过记录');
                return;
            }
            
            const record = { 
                timestamp: now, 
                count, 
                image: imageData 
            };
            detectionRecords.unshift(record);
            
            // 限制记录数量，超出时清理旧记录
            while (detectionRecords.length > MEMORY_CONFIG.maxRecords) {
                const oldRecord = detectionRecords.pop();
                oldRecord.image = null;
            }
            
            updateRecordsList();
        }
        
        // 内存清理函数
        let cleanupTimer = null;
        let yoloMemoryWarning = false;
        
        function startMemoryCleanup() {
            if (cleanupTimer) clearInterval(cleanupTimer);
            
            cleanupTimer = setInterval(() => {
                // 强制垃圾回收提示（如果可用）
                if (window.gc) {
                    window.gc();
                }
                
                // 清理超出限制的记录
                while (detectionRecords.length > MEMORY_CONFIG.maxRecords) {
                    const oldRecord = detectionRecords.pop();
                    if (oldRecord) oldRecord.image = null;
                }
                
                // 如果使用YOLO，定期检查内存并警告
                if (useYOLO && performance.memory) {
                    const usedMB = Math.round(performance.memory.usedJSHeapSize / 1048576);
                    const limitMB = Math.round(performance.memory.jsHeapSizeLimit / 1048576);
                    const usagePercent = Math.round((usedMB / limitMB) * 100);
                    
                    if (usagePercent > 80 && !yoloMemoryWarning) {
                        yoloMemoryWarning = true;
                        console.warn('内存使用过高:', usedMB + 'MB / ' + limitMB + 'MB (' + usagePercent + '%)');
                        console.warn('建议切换到COCO-SSD模型以降低内存占用');
                    } else if (usagePercent < 60) {
                        yoloMemoryWarning = false;
                    }
                }
            }, MEMORY_CONFIG.cleanupInterval);
        }
        
        function stopMemoryCleanup() {
            if (cleanupTimer) {
                clearInterval(cleanupTimer);
                cleanupTimer = null;
            }
            // 清理YOLO缓冲区
            yoloFloatBuffer = null;
        }
